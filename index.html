<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <article class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p class="event-info">15 ноября, 18:30</p>
      <p class="event-info">Музей космонавтики, проспект Мира, 111</p>
      <p class="event-description">Вечерняя программа с выставкой и экскурсиями</p>

      <button type="button" id="show-program" class="button">Показать программу</button>
      <div id="program" class="program" hidden></div>
      <p id="data-error" class="message error" hidden></p>
    </article>

    <form id="service-form" class="card service-form" hidden>
      <h2>Дополнительные услуги</h2>
      <label class="service-option"><input type="checkbox" id="guide" name="guide"> Экскурсия с гидом</label>
      <label class="service-option"><input type="checkbox" id="audio" name="audio"> Аудиогид</label>
      <label class="service-option"><input type="checkbox" id="catalog" name="catalog"> Каталог выставки</label>
      <button type="submit" class="button">Рассчитать</button>

      <p id="choice-error" class="message error" hidden></p>
      <p id="result" class="message result" hidden></p>
      <pre id="report-json" class="report-json" hidden></pre>
    </form>
  </main>

  <script src="app.js"></script>
</body>
</html>
